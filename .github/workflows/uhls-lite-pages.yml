name: µhLS Pages

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/uhls/**"
      - "doc/figs/uhls_logo.svg"
      - "doc/notebooks/uir_cookbook.ipynb"
      - "doc/uhls-lite/**"
      - "requirements.txt"
      - ".github/workflows/uhls-lite-pages.yml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: doc/uhls-lite/requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install browser-demo build dependencies
        run: python -m pip install -r doc/uhls-lite/requirements.txt

      - name: Build landing page and JupyterLite demo
        run: bash doc/uhls-lite/build.sh

      - name: Check the JupyterLite site
        working-directory: doc/uhls-lite/_build/lite
        run: jupyter lite check --lite-dir . --output-dir ../site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: doc/uhls-lite/_build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
